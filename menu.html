<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu | Cold Carving</title>
  <link rel="stylesheet" href="style.css?v=10" />
</head>

<body class="menu-view">

  <!-- NAV -->
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="index.html">
        <img src="assets/logo.png" alt="Cold Carving logo" />
        <div class="title">
          <strong>Cold Carving</strong>
          <span>Carved Fresh. Served Cold.</span>
        </div>
      </a>

      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>

      <nav class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="index.html#products">Products</a>
        <a class="active" href="menu.html">Menu Card</a>
        <a href="index.html#ingredients">Ingredients</a>
        <a href="index.html#gallery">Gallery</a>
        <a href="index.html#location">Location</a>
        <a href="index.html#contact">Contact</a>
      </nav>
    </div>
  </header>

  <!-- MENU -->
  <main class="menu-page">
    <div class="menu-fit">
      <img src="assets/menu.jpeg" alt="Cold Carving Menu" />
    </div>

    <div class="menu-actions">
      <a class="btn" href="index.html">← Back to Home</a>
      <a class="btn primary" href="assets/menu.jpeg" target="_blank" rel="noopener">Download the Menu</a>
    </div>
  </main>

  <!-- Measure actual navbar height and store it in CSS var -->
  <script>
    (function () {
      const nav = document.querySelector(".nav");
      const setNavH = () => {
        if (!nav) return;
        document.documentElement.style.setProperty("--real-nav-h", nav.offsetHeight + "px");
      };
      setNavH();
      window.addEventListener("resize", setNavH);
    })();
  </script>

  <script src="script.js"></script>
</body>
</html>
